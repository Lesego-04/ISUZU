<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stay True to Your Isuzu</title>
<style>
  body {margin:0;padding:0;background:#000;}
  table {border-collapse:collapse;}
  img {border:0;display:block;max-width:100%;height:auto;}
  .hero-video {display:none!important;max-height:0;overflow:hidden;mso-hide:all;}
  /* Apple Mail and selected WebKit email clients support HTML5 video. */
  @supports (-webkit-overflow-scrolling:touch) {
    .hero-video {display:block!important;max-height:none!important;}
    .hero-fallback {display:none!important;}
  }
</style>
</head>
<body>
<center>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#000000;">
<tr><td align="center">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;">
<tr><td style="background-color:#000000;">
<!--[if !mso]><!-->
<div class="hero-video" style="display:none;max-height:0;overflow:hidden;">
<video autoplay muted loop playsinline webkit-playsinline preload="auto" poster="https://YOUR-DOMAIN.example/isuzu_email_hero_poster.jpg" width="600" style="display:block;width:100%;height:auto;background:#000;" aria-label="Stay True to Your Isuzu video">
<source src="https://YOUR-DOMAIN.example/isuzu_truefit_email_1200x600_red_true.mp4" type="video/mp4">
<a href="https://YOUR-VIDEO-LANDING-PAGE.example/"><img src="https://YOUR-DOMAIN.example/isuzu_email_hero_poster.jpg" width="600" alt="Watch the Stay True to Your Isuzu video" style="width:100%;height:auto;"></a>
</video>
</div>
<!--<![endif]-->
<div class="hero-fallback">
<a href="https://YOUR-VIDEO-LANDING-PAGE.example/" target="_blank" style="text-decoration:none;">
<img src="https://YOUR-DOMAIN.example/isuzu_email_hero_poster.jpg" width="600" alt="Stay True to Your Isuzu — click to watch" style="width:100%;height:auto;">
</a>
</div>
</td></tr></table>
</td></tr></table>
</center>
